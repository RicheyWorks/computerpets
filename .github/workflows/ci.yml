name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'cries-in/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'cries-in/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build, test, and package application
        run: mvn -B verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: computerpets-backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  desktop-contract:
    name: Desktop client contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: License unlock tests
        working-directory: desktop
        run: npm test

  web-desk:
    name: Web desk tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # web/package-lock.json installs with npm 10 (Node 22) and npm 11 (Node 24) alike.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # walker-art.test.mjs runs web/scripts/assert-walker-art.py, which reads the sprites.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sprite check tools
        run: python -m pip install pillow numpy

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web tests
        working-directory: web
        run: npm test

      # Holds tsc output at web/tsc-baseline.txt: more lines fail, fewer pass with a note.
      - name: Type-check holds the baseline
        working-directory: web
        run: node scripts/tsc-baseline.mjs

  pyqt-client:
    name: PyQt blotter client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 libxcb-xinerama0

      - name: Install client
        working-directory: client
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Decrypt and unlock tests
        working-directory: client
        run: pytest

      - name: Offscreen window with a living pet
        working-directory: client
        run: python -m computerpets_client --check
        env:
          QT_QPA_PLATFORM: offscreen

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      # Keyless cosign (Sigstore Fulcio) via GitHub OIDC — ADR 0061
      id-token: write
    # Only build Docker image on main branch pushes (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest (keyless)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "Refuse: docker build-push produced no digest" >&2
            exit 1
          fi
          # Sign the immutable digest only — never a mutable tag (ADR 0061).
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"

      - name: Verify image signature (fail-closed)
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}@${DIGEST}"
          IDENTITY="https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity="${IDENTITY}" \
            --certificate-oidc-issuer="${ISSUER}" \
            "${IMAGE}"
          echo "Signed and verified: ${IMAGE}"
