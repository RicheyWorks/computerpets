<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0b0a;
        color: #f2ece3;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      img.bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 62%;
      }
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgb(12 11 10 / 0.28), rgb(12 11 10 / 0.78) 78%);
      }
      .copy {
        position: absolute;
        left: 72px;
        bottom: 78px;
        max-width: 720px;
      }
      .kicker {
        font-family: Figtree, sans-serif;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #9a9288;
        margin: 0 0 14px;
      }
      h1 {
        font-family: Fraunces, Palatino, serif;
        font-size: 84px;
        line-height: 0.92;
        letter-spacing: -0.03em;
        font-weight: 500;
        margin: 0 0 16px;
      }
      p {
        font-family: Figtree, sans-serif;
        font-size: 22px;
        color: #d8cfc0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="bg" src="/habitat.jpg" alt="" />
      <div class="veil"></div>
      <div class="copy">
        <p class="kicker">ComputerPets</p>
        <h1>They live<br />on the desk.</h1>
        <p>One hundred twenty living demos. The guest is already walking.</p>
      </div>
    </div>
  </body>
</html>
