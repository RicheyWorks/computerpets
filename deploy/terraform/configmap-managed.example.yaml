# Example ConfigMap overlay after Terraform apply (NOT in kustomization).
#
# Replace SPRING_DATASOURCE_URL / REDIS_HOST with terraform outputs
# `spring_datasource_url` and `redis_host`. Set BUNDLE_BASE_URL from
# `bundle_base_url` (Secret or ConfigMap). Then drop the in-cluster
# postgres + redis Deployments from the live overlay.
#
# Secrets still come from computerpets-secrets via External Secrets
# (deploy/k8s/external-secret.example.yaml) — not from this ConfigMap.
# COMPUTERPETS_SECRETS_SOURCE=external-secrets is required on prod
# (ADR 0064); plain hand-filled secret.yaml is refused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: computerpets-config
  namespace: computerpets
data:
  SPRING_PROFILES_ACTIVE: prod
  COMPUTERPETS_SECRETS_SOURCE: external-secrets
  # terraform spring_datasource_url already includes ?sslmode=require
  # (or verify-full&sslrootcert=... when postgres_ssl_root_cert is set).
  SPRING_DATASOURCE_URL: jdbc:postgresql://REPLACE_WITH_TF_OUTPUT:5432/computerpets?sslmode=require
  POSTGRES_SSL_REQUIRED: "true"
  # When postgres_ssl_root_cert was set, the URL uses verify-full and this
  # path is the same PEM the operator mounted. This repo does not ship a CA.
  # POSTGRES_SSL_ROOT_CERT: /etc/ssl/rds-ca.pem
  REDIS_HOST: REPLACE_WITH_TF_OUTPUT
  REDIS_PORT: "6379"
  RATE_LIMIT_BACKEND: redis
  # In-cluster redis.yaml is AUTH-less: leave SSL and AUTH_REQUIRED unset.
  # Managed ElastiCache with redis_auth_enabled (ADR 0075): set both to true.
  # The token is REDIS_PASSWORD on the Secret (or REDIS_PASSWORD_FILE), not here.
  # REDIS_SSL: "true"
  # REDIS_AUTH_REQUIRED: "true"
  MICROSOFT_DEV_MODE: "false"
  SERVER_PORT: "8081"
  # Optional: web sites whose /admin page may call /api/admin/** (comma-separated origins).
  # Unset = any origin; every admin call is still HMAC-signed (ADR 0071). Do not invent a host.
  # ADMIN_ALLOWED_ORIGINS: "https://replace-with-your-web-site.example"
  # Public listener TLS (ADR 0077). In-cluster Service leaves these unset.
  # Replace the host with the name on your ACM certificate. Do not invent one.
  API_LISTENER_TLS_REQUIRED: "true"
  API_PUBLIC_BASE_URL: https://replace-with-public-host.example
  # Optional read replica (ADR 0059) — set only when a managed replica exists.
  # Use the same sslmode as the primary (ADR 0076). Do not invent a replica host.
  # SPRING_DATASOURCE_REPLICA_URL: jdbc:postgresql://REPLACE_REPLICA:5432/computerpets?sslmode=require
