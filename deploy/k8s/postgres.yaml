apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: computerpets-postgres
  namespace: computerpets
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-postgres
  namespace: computerpets
  labels:
    app: computerpets-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: computerpets-postgres
  template:
    metadata:
      labels:
        app: computerpets-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: computerpets-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "computerpets", "-d", "computerpets"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "computerpets", "-d", "computerpets"]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: computerpets-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: computerpets-postgres
  namespace: computerpets
spec:
  selector:
    app: computerpets-postgres
  ports:
    - port: 5432
      targetPort: postgres
