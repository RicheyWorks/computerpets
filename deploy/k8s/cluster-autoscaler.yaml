# Cluster Autoscaler for the private multi-AZ API node groups (ADR 0083).
# High availability is ADR 0090: two replicas, required hostname
# anti-affinity, preferred zone anti-affinity, leader election on.
# Pool pin is ADR 0091: nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api. A preference would still admit other nodes.
# Not in kustomization.yaml. Local/dev `kubectl apply -k deploy/k8s` does
# not install this. Kind and minikube set enable_node_pool=false and do
# not apply this file. That switch does not label their nodes. Applying
# this file there leaves both pods Pending. That is the feature-off path.
# Do not delete the pool key to make a laptop apply schedule. There is no
# overlay directory.
#
# Before apply, substitute three tokens:
#   CLUSTER_NAME  -> eks_cluster_name
#   AWS_REGION    -> aws_region
#   arn:aws:iam::000000000000:role/computerpets-prod-cluster-autoscaler
#                 -> the cluster_autoscaler_role_arn output
# Do not commit a real account id. The image tag is v1.36.1, which matches
# Kubernetes 1.36. If the keeper's cluster minor is older, replace the tag
# with that minor's latest patch before apply. Do not use a floating tag.
#
# This Deployment does not create nodes by itself. It sets desired capacity
# on the Auto Scaling groups the managed node groups already own. Terraform
# ignores desired_size after create. min stays 1 per zone. max is at least
# the HPA ceiling. Scale-down still honors PodDisruptionBudgets.
# Karpenter is not installed.
#
# Two pods share one ServiceAccount and one IRSA role. Only the leader
# changes desired capacity. The standby waits on the kube-system Lease
# named cluster-autoscaler. A one-node cluster that applies this file
# leaves the second pod Pending. Do not apply it on kind or minikube.
#
# Pool pin (ADR 0091). nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api, the label modules/node_pool already sets.
# Required hostname anti-affinity then needs two hostnames inside that
# pool. Nodes outside the groups do not satisfy it. Zone anti-affinity
# stays preferred, so a single-zone set of labeled nodes still schedules
# both pods when two hostnames exist. The API Deployments do not select
# this label.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/computerpets-prod-cluster-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["watch", "list", "get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - cluster-autoscaler-status
      - cluster-autoscaler-priority-expander
    verbs: ["delete", "get", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cluster-autoscaler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cluster-autoscaler
              namespaces:
                - kube-system
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cluster-autoscaler
                namespaces:
                  - kube-system
                topologyKey: topology.kubernetes.io/zone
      # ADR 0091. Both keys are required. Kind and minikube omit the
      # pool label and do not apply this file.
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      serviceAccountName: cluster-autoscaler
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - ./cluster-autoscaler
            - --cloud-provider=aws
            - --namespace=kube-system
            - --leader-elect=true
            - --leader-elect-resource-lock=leases
            - --leader-elect-resource-name=cluster-autoscaler
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled=true,k8s.io/cluster-autoscaler/CLUSTER_NAME=owned
            - --balance-similar-node-groups=true
            - --skip-nodes-with-system-pods=false
            - --expander=least-waste
          env:
            - name: AWS_REGION
              value: AWS_REGION
            - name: AWS_DEFAULT_REGION
              value: AWS_REGION
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 600Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
