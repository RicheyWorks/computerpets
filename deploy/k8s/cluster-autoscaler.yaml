# Cluster Autoscaler for the private multi-AZ API node groups (ADR 0083).
# High availability is ADR 0090: two replicas, required hostname
# anti-affinity, leader election on. Zone placement is ADR 0099: one
# topologySpreadConstraints item on topology.kubernetes.io/zone,
# maxSkew 1, whenUnsatisfiable DoNotSchedule, nodeAffinityPolicy Honor,
# nodeTaintsPolicy Honor. minDomains is unset. Do not set minDomains.
# The zone preference from ADR 0090 is not kept beside this item. There
# is one zone rule. Required zone anti-affinity is not set. That required
# rule would leave the second pod Pending when every node shares one zone.
# Pool pin is ADR 0091: nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api. A preference would still admit other nodes.
# Disruption budget is ADR 0092: policy/v1 PodDisruptionBudget,
# minAvailable 1, selector app=cluster-autoscaler (the Deployment
# selector). minAvailable 2 with replicas 2 allows zero voluntary
# evictions. One pod can drain while the other holds or takes the lease.
# Not in kustomization.yaml. Local/dev `kubectl apply -k deploy/k8s` does
# not install this. Kind and minikube set enable_node_pool=false and do
# not apply this file, so they do not install this budget or this spread.
# That switch does not label their nodes and does not set a zone.
# Applying this file there leaves both pods Pending until a node carries
# computerpets/node-pool=api and one topology.kubernetes.io/zone value.
# One labeled zone still schedules both pods when two hostnames exist.
# Hard spread does not invent a second zone. A node that omits the zone
# label does not receive a pod. That is the feature-off path.
# Do not delete the pool key to make a laptop apply schedule. Do not taint a
# kind or minikube node. Do not apply this budget on a cluster that is
# not running these two replicas. There is no overlay directory.
#
# Before apply, substitute three tokens:
#   CLUSTER_NAME  -> eks_cluster_name
#   AWS_REGION    -> aws_region
#   arn:aws:iam::000000000000:role/computerpets-prod-cluster-autoscaler
#                 -> the cluster_autoscaler_role_arn output
# Do not commit a real account id. The image tag is v1.36.1, which matches
# Kubernetes 1.36. If the keeper's cluster minor is older, replace the tag
# with that minor's latest patch before apply. Do not use a floating tag.
#
# This Deployment does not create nodes by itself. It sets desired capacity
# on the Auto Scaling groups the managed node groups already own. Terraform
# ignores desired_size after create. min is 3 per zone (ADR 0106). max is 20.
# The HPA ceiling is 3 (ADR 0108), so one Ready zone holds it at one pod
# per hostname. The ADR 0107 ceiling of 6 stacked on that zone.
# Scale-down still honors PodDisruptionBudgets.
# Karpenter is not installed.
#
# Two pods share one ServiceAccount and one IRSA role. Only the leader
# changes desired capacity. The standby waits on the kube-system Lease
# named cluster-autoscaler. The standby is not the scaler (ADR 0101).
# A Pending replica never holds the lease (ADR 0110). v1.36.1 acquires
# leases/cluster-autoscaler inside the running container.
# The Running leader remains the scaler. The scheduled leader still raises desired
# capacity on the underfilled zone's Auto Scaling group.
# --balance-similar-node-groups=true, --expander=least-waste, and
# --skip-nodes-with-system-pods=false stay. --namespace=kube-system is
# the lease namespace, not a pod filter. --salvo-scale-up=true runs
# another scale-up in that same loop for pods the first least-waste
# choice did not place, including the underfilled zone (ADR 0102).
# The budget is 1m. --frequent-loops-enabled=true stays, so a loop
# that did scale up starts the next pass without waiting out the
# scan interval. There is no priority expander ConfigMap. That 1m
# budget stays. It is not the 15m node-provision wait. Node-group
# backoff stays at the v1.36.1 defaults, unset on the command. A
# budget that is already gone, a failed snapshot update, or a
# scale-up that is not successful still ends the salvo. The next
# main loop is the retry (ADR 0103). A one-node cluster that applies
# this file leaves the second pod Pending. Do not apply it on kind
# or minikube.
#
# Pool pin (ADR 0091). nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api, the label modules/node_pool already sets.
# Required hostname anti-affinity then needs two hostnames inside that
# pool. Nodes outside the groups do not satisfy it. Zone spread (ADR 0099)
# is DoNotSchedule on topology.kubernetes.io/zone. On two or more labeled
# zones that can take a pod, the two replicas cannot share one zone. One
# labeled zone still schedules both pods when two hostnames exist: unset
# minDomains behaves as 1, so the only domain keeps skew at 1. A node
# that omits the zone label is skipped. Kind and minikube do not apply
# this file. The API Deployments select the same label (ADR 0093).
#
# Disruption budget (ADR 0092). policy/v1 PodDisruptionBudget
# cluster-autoscaler in kube-system. minAvailable is 1. The selector is
# app=cluster-autoscaler, the same matchLabels as the Deployment.
# minAvailable 2 is not used: with two replicas it would block every
# voluntary eviction, including a drain that should leave the standby.
# A node crash is not a voluntary disruption. Kind and minikube do not
# apply this file, so they do not install this budget.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/computerpets-prod-cluster-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["watch", "list", "get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - cluster-autoscaler-status
      - cluster-autoscaler-priority-expander
    verbs: ["delete", "get", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cluster-autoscaler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cluster-autoscaler
              namespaces:
                - kube-system
              topologyKey: kubernetes.io/hostname
      # ADR 0099. One zone rule. maxSkew 1, DoNotSchedule, Honor policies.
      # minDomains is unset. Do not set minDomains. One labeled zone still
      # schedules. Kind and minikube do not apply this file. Required zone
      # anti-affinity is not set.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: cluster-autoscaler
      # ADR 0091. Both keys are required. Kind and minikube omit the
      # pool label and do not apply this file.
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      # API pool taint (ADR 0094). Kind and minikube do not apply this file.
      tolerations:
        - key: computerpets/node-pool
          operator: Equal
          value: api
          effect: NoSchedule
      serviceAccountName: cluster-autoscaler
      # ADR 0110. system-cluster-critical can preempt a priority-0 pod so
      # this replica can become Running and then take the lease. It does
      # not start a Pending container. system-node-critical is not used.
      priorityClassName: system-cluster-critical
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.36.1
          imagePullPolicy: IfNotPresent
          # ADR 0101. The standby is not the scaler. Only the replica that
          # holds the lease calls SetDesiredCapacity. Similar per-zone
          # groups stay balanced. least-waste is the only expander.
          # skip-nodes-with-system-pods stays false. That flag is
          # scale-down. It is not a filter of kube-system Pending pods.
          # --namespace=kube-system is the lease namespace. There is no
          # scheduler allow-list and no --nodes list. Do not set minDomains.
          # ADR 0102. One expander choice still names one option. Salvo
          # runs another choice in the same loop for the pods that
          # option did not place. The budget is 1m. Frequent loops stay
          # on. A priority expander ConfigMap is not created.
          # ADR 0103. The 1m budget stays. Node-provision time and
          # node-group backoff stay at the v1.36.1 defaults. A budget
          # that is already gone, a failed snapshot update, or a
          # scale-up that is not successful ends the salvo. The next
          # main loop is the retry.
          # ADR 0104. Each zone's max_size is 20. The leader reads that
          # as the Auto Scaling group MaxSize. It does not raise it.
          # --max-nodes-total stays unset.
          # ADR 0109. That 20 stays above a one-zone floor of 8
          # (HPA ceiling 3 + these 2 pods + metrics-server 2 + one
          # drain node). Twice the HPA ceiling is 6 and is refused.
          # This set binds on min_size 3, so MaxLimitReached at 20
          # is unreachable. Do not set minDomains.
          # ADR 0110. A Pending pod never holds the lease. The Running
          # leader remains the scaler. Lease duration, renew deadline,
          # and retry period stay at the v1.36.1 defaults, unset here.
          # No flag hands the lease to a container that has not started.
          # ADR 0105. Each zone's min_size was 2. Two healthy zones were
          # four API hostnames. One unhealthy zone still stacked 2 and 1.
          # ADR 0106. Each zone's min_size is 3. One Ready zone is three
          # hostnames, so the HPA floor is 1 and 1 and 1. The leader does
          # not scale a group below that min. Do not set minDomains.
          # ADR 0107 set a healthy-pool ceiling of 6. ADR 0108. The HPA
          # ceiling is 3, one pod per hostname in the one Ready zone.
          # The leader does not add a node for a ceiling pod that already
          # bound. Do not set minDomains.
          command:
            - ./cluster-autoscaler
            - --cloud-provider=aws
            - --namespace=kube-system
            - --leader-elect=true
            - --leader-elect-resource-lock=leases
            - --leader-elect-resource-name=cluster-autoscaler
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled=true,k8s.io/cluster-autoscaler/CLUSTER_NAME=owned
            - --balance-similar-node-groups=true
            - --skip-nodes-with-system-pods=false
            - --expander=least-waste
            - --salvo-scale-up=true
            - --salvo-scale-up-budget=1m
            - --frequent-loops-enabled=true
          env:
            - name: AWS_REGION
              value: AWS_REGION
            - name: AWS_DEFAULT_REGION
              value: AWS_REGION
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 600Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
