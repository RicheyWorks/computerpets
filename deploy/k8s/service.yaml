# Flip spec.selector.color to green after computerpets-green is Ready.
# Point the HPA and the PDB at that same color before scaling the old color to 0.
apiVersion: v1
kind: Service
metadata:
  name: computerpets
  namespace: computerpets
spec:
  selector:
    app: computerpets
    color: blue
  ports:
    - name: http
      port: 8081
      targetPort: http
