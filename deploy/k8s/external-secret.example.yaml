# Kubernetes ExternalSecret example (not applied by kustomization)
#
# Phase 2.4 / ADR 0064 prod path: External Secrets Operator (or Vault Agent)
# materializes the same Opaque Secret the Deployments already envFrom —
# `computerpets-secrets` with LICENSE_SECRET_KEY, JWT_SECRET_KEY,
# BUNDLE_SIGNING_KEY, ADMIN_API_KEY, and Postgres credentials.
#
# After apply, set COMPUTERPETS_SECRETS_SOURCE=external-secrets on the
# ConfigMap / Deployment (ProductionProfileGuard refuses plain env Secret
# on prod without this attestation). Run:
#   ./deploy/k8s/verify-secret-operator.sh deploy/k8s/external-secret.example.yaml
# Rotation dual-key (ADR 0065): temporarily map NAME_PREVIOUS siblings the
# same way; see docs/SETUP.md § Secret rotation. Gate:
#   ./deploy/k8s/verify-secret-rotation.sh
#
# Terraform (deploy/terraform/modules/secrets, ADR 0062) creates matching
# AWS Secrets Manager shells named computerpets/<KEY>. Populate values out
# of band — never via *.tfvars — then point secretStoreRef at that store.
# No live terraform apply is required for this contract.
#
# This file is documentation scaffolding. It is NOT in kustomization.yaml.
# Install External Secrets Operator first, create a ClusterSecretStore /
# SecretStore that matches your keeper (Vault / AWS / GCP / Azure), then
# apply a copy with real remoteRef keys. Do not invent store paths here.
#
# Deny-safe: empty remote keys still produce empty Secret data; the app
# refuse-starts on missing / placeholder crypto keys. Never put real
# values in git.
#
# Alternative without ESO: Vault Agent Injector / template files mounted
# at /run/secrets/* and NAME_FILE env (deployment-secrets-file.example.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: computerpets-secrets
  namespace: computerpets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: computerpets-store
    kind: SecretStore
  target:
    name: computerpets-secrets
    creationPolicy: Owner
  data:
    - secretKey: LICENSE_SECRET_KEY
      remoteRef:
        key: computerpets/LICENSE_SECRET_KEY
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: computerpets/JWT_SECRET_KEY
    - secretKey: BUNDLE_SIGNING_KEY
      remoteRef:
        key: computerpets/BUNDLE_SIGNING_KEY
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: computerpets/ADMIN_API_KEY
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: computerpets/SPRING_DATASOURCE_USERNAME
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: computerpets/SPRING_DATASOURCE_PASSWORD
    - secretKey: POSTGRES_USER
      remoteRef:
        key: computerpets/POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: computerpets/POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: computerpets/POSTGRES_DB
    # Optional Redis AUTH token (ADR 0075). Not a house crypto key and not
    # created by modules/secrets. Add this remoteRef only when redis_auth_enabled
    # is true, and populate computerpets/REDIS_PASSWORD out of band.
    # In-cluster redis.yaml stays AUTH-less — leave this commented.
    # - secretKey: REDIS_PASSWORD
    #   remoteRef:
    #     key: computerpets/REDIS_PASSWORD
    # Optional metrics scrape bearer (ADR 0133), 32+ chars. Unset keeps
    # /actuator/prometheus closed to everyone. Not created by modules/secrets.
    # - secretKey: METRICS_SCRAPE_TOKEN
    #   remoteRef:
    #     key: computerpets/METRICS_SCRAPE_TOKEN
