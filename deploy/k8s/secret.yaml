# Scaffolding Opaque Secret — NOT the production path (ADR 0064).
#
# Hand-filled stringData / plain env Secret is refused when
# spring.profiles.active=prod unless the operator attests:
#   COMPUTERPETS_SECRETS_SOURCE=external-secrets|file|vault-agent
# or (local scaffolding only) COMPUTERPETS_ALLOW_PLAIN_SECRET=1.
#
# Prod path: apply external-secret.example.yaml (ESO) or
# deployment-secrets-file.example.yaml (*_FILE mounts), then run
# ./deploy/k8s/verify-secret-operator.sh before roll out.
#
# Replace every CHANGE_ME / empty crypto key before a local apply.
# The app fail-hard-starts if LICENSE / JWT / BUNDLE / ADMIN keys are
# missing, placeholder, or the wrong length. Do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: computerpets-secrets
  namespace: computerpets
type: Opaque
stringData:
  LICENSE_SECRET_KEY: ""
  JWT_SECRET_KEY: ""
  BUNDLE_SIGNING_KEY: ""
  ADMIN_API_KEY: ""
  SPRING_DATASOURCE_USERNAME: computerpets
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME
  POSTGRES_USER: computerpets
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: computerpets
