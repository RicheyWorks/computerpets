# Prod profile ConfigMap. Do NOT set COMPUTERPETS_SECRETS_SOURCE here —
# operators attest on apply (external-secrets / file / vault-agent).
# Do NOT set COMPUTERPETS_ALLOW_PLAIN_SECRET (local scaffolding escape only).
# See ADR 0064 and deploy/k8s/verify-secret-operator.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: computerpets-config
  namespace: computerpets
data:
  SPRING_PROFILES_ACTIVE: prod
  # In-cluster Postgres has no TLS. Leave POSTGRES_SSL_REQUIRED unset (ADR 0076).
  SPRING_DATASOURCE_URL: jdbc:postgresql://computerpets-postgres:5432/computerpets
  REDIS_HOST: computerpets-redis
  REDIS_PORT: "6379"
  RATE_LIMIT_BACKEND: redis
  # Optional: comma CIDRs for X-Forwarded-For / Forwarded (ADR 0067). Empty = remoteAddr only.
  # TRUSTED_PROXY_CIDRS: "10.0.0.0/8"
  MICROSOFT_DEV_MODE: "false"
  SERVER_PORT: "8081"
