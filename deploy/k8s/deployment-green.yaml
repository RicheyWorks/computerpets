# Idle color. Not an HPA target (ADR 0078). Not a PDB target (ADR 0079).
# Scale up, wait Ready, then patch the Service selector to color=green.
# See deploy/k8s/README.md.
# Same probes, secrets, prod profile, and soft hostname spread as blue (ADR 0080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-green
  namespace: computerpets
  labels:
    app: computerpets
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: computerpets
      color: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: computerpets
        color: green
    spec:
      # Soft hostname spread (ADR 0080). Same rule as blue, scoped to
      # color=green, so a cutover scale-up prefers different nodes.
      # ScheduleAnyway still binds when the skew cannot be met.
      # DoNotSchedule would leave that pod Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: green
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h computerpets-postgres -U computerpets -d computerpets; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h computerpets-redis ping; do sleep 2; done"]
      containers:
        - name: computerpets
          image: ghcr.io/richeyworks/computerpets:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: computerpets-config
            - secretRef:
                name: computerpets-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
