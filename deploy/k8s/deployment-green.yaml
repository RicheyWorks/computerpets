# Idle color. Not an HPA target (ADR 0078). Not a PDB target (ADR 0079).
# Scale up, wait Ready, then patch the Service selector to color=green.
# See deploy/k8s/README.md.
# Same probes, secrets, prod profile, hard hostname spread, and hard zone
# spread as blue (ADR 0080, ADR 0081, ADR 0095, ADR 0100).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-green
  namespace: computerpets
  labels:
    app: computerpets
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: computerpets
      color: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: computerpets
        color: green
    spec:
      # Hard hostname spread (ADR 0080, hardened by ADR 0100). Hard zone
      # spread (ADR 0095). Same rules as blue, scoped to color=green.
      # Both items are DoNotSchedule, maxSkew 1, nodeAffinityPolicy Honor,
      # nodeTaintsPolicy Honor. No minDomains. On two or more pool
      # hostnames that can take a pod, a cutover scale-up cannot place
      # every green pod on one node. One hostname still schedules: a
      # single domain keeps skew at 1. The second pod is not left Pending
      # by this item. Required hostname anti-affinity is not set. Do not
      # set minDomains. On two or more pool zones that can take a pod, the
      # same scale-up cannot place every green pod in one zone. One
      # labeled zone still schedules. A node that omits
      # topology.kubernetes.io/zone is skipped. Kind and minikube omit
      # that label unless a human sets one zone value.
      # Pool pin (ADR 0093). Same nodeSelector as blue: kubernetes.io/os=linux
      # and computerpets/node-pool=api. Both spread items set
      # nodeAffinityPolicy Honor. Kind and minikube apply this file. Their
      # nodes omit the pool label unless a human adds it, so a scaled-up
      # green pod stays Pending. Do not delete the pool key to make a
      # laptop apply schedule. replicas stays 0.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: green
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: green
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      # API pool taint (ADR 0094). Same toleration as blue.
      # A toleration does not require the taint.
      # Kind and minikube are not tainted.
      # Do not taint a kind or minikube node. replicas stays 0.
      tolerations:
        - key: computerpets/node-pool
          operator: Equal
          value: api
          effect: NoSchedule
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h computerpets-postgres -U computerpets -d computerpets; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h computerpets-redis ping; do sleep 2; done"]
      containers:
        - name: computerpets
          image: ghcr.io/richeyworks/computerpets:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: computerpets-config
            - secretRef:
                name: computerpets-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
