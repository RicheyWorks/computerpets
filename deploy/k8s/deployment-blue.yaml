apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-blue
  namespace: computerpets
  labels:
    app: computerpets
    color: blue
spec:
  # Local/dev count. The prod floor is deploy/k8s/hpa.yaml (ADR 0078),
  # which is not applied by the kustomization.
  replicas: 2
  selector:
    matchLabels:
      app: computerpets
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: computerpets
        color: blue
    spec:
      # Soft hostname spread (ADR 0080). Hard zone spread (ADR 0095).
      # Hostname stays ScheduleAnyway. The default nodeTaintsPolicy counts
      # a tainted control-plane node as an empty domain and would leave the
      # second local pod, and the HPA floor of 3, Pending. ScheduleAnyway
      # still prefers a less-loaded hostname and still binds.
      # The zone item is DoNotSchedule, maxSkew 1, nodeAffinityPolicy Honor,
      # nodeTaintsPolicy Honor. No minDomains. On two or more pool zones
      # that can take a pod, this color cannot place every pod in one zone.
      # One labeled zone still schedules: minDomains is unset, so it behaves
      # as 1, and the only domain keeps skew at 1. Hard spread does not
      # invent a second zone. A node that omits topology.kubernetes.io/zone
      # is skipped. Kind and minikube omit that label unless a human sets
      # one zone value. Do not set minDomains. That would leave pods Pending
      # on a laptop that has only one zone label.
      # Pool pin (ADR 0093). nodeSelector requires kubernetes.io/os=linux
      # and computerpets/node-pool=api, the label the node pool already
      # sets. Both spread items set nodeAffinityPolicy Honor so a node
      # that fails that selector is not an empty domain. Kind and minikube
      # apply this file. Their nodes omit the pool label unless a human
      # adds it, so these pods stay Pending.
      # Do not delete the pool key to make a laptop apply schedule.
      # One labeled node still schedules both replicas when that node also
      # carries one zone label.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      # API pool taint (ADR 0094). Matches computerpets/node-pool=api:NoSchedule
      # on the node group. A toleration does not require the taint. Kind
      # and minikube are not tainted. Do not taint a kind or minikube node.
      tolerations:
        - key: computerpets/node-pool
          operator: Equal
          value: api
          effect: NoSchedule
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h computerpets-postgres -U computerpets -d computerpets; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h computerpets-redis ping; do sleep 2; done"]
      containers:
        - name: computerpets
          image: ghcr.io/richeyworks/computerpets:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: computerpets-config
            - secretRef:
                name: computerpets-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
