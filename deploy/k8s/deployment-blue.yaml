apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-blue
  namespace: computerpets
  labels:
    app: computerpets
    color: blue
spec:
  # Local/dev count. The prod floor is deploy/k8s/hpa.yaml (ADR 0078),
  # which is not applied by the kustomization.
  replicas: 2
  selector:
    matchLabels:
      app: computerpets
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: computerpets
        color: blue
    spec:
      # Soft hostname spread (ADR 0080) and soft zone spread (ADR 0081).
      # The default whenUnsatisfiable is DoNotSchedule, and the default
      # nodeTaintsPolicy counts a tainted control-plane node as an empty
      # domain. That pair leaves the second local pod, and the HPA floor
      # of 3, Pending. ScheduleAnyway still prefers a less-loaded hostname
      # and a less-loaded zone, and still binds. DoNotSchedule on the zone
      # key would also reject nodes that omit topology.kubernetes.io/zone
      # (a local cluster). Prod should run workers in more than one zone.
      # Pool pin (ADR 0093). nodeSelector requires kubernetes.io/os=linux
      # and computerpets/node-pool=api, the label the node pool already
      # sets. Both spread items set nodeAffinityPolicy Honor so a node
      # that fails that selector is not an empty domain. ScheduleAnyway
      # stays. Kind and minikube apply this file. Their nodes omit the
      # pool label unless a human adds it, so these pods stay Pending.
      # Do not delete the pool key to make a laptop apply schedule.
      # One labeled node still schedules both replicas.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h computerpets-postgres -U computerpets -d computerpets; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h computerpets-redis ping; do sleep 2; done"]
      containers:
        - name: computerpets
          image: ghcr.io/richeyworks/computerpets:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: computerpets-config
            - secretRef:
                name: computerpets-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
