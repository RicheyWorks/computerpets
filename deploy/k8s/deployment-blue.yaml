apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-blue
  namespace: computerpets
  labels:
    app: computerpets
    color: blue
spec:
  # Local/dev count. The prod floor is deploy/k8s/hpa.yaml (ADR 0078),
  # which is not applied by the kustomization.
  replicas: 2
  selector:
    matchLabels:
      app: computerpets
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: computerpets
        color: blue
    spec:
      # Soft hostname spread (ADR 0080). The default whenUnsatisfiable is
      # DoNotSchedule, and the default nodeTaintsPolicy counts a tainted
      # control-plane node as an empty domain. That pair leaves the second
      # local pod, and the HPA floor of 3, Pending. ScheduleAnyway still
      # prefers a less-loaded hostname and still binds.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h computerpets-postgres -U computerpets -d computerpets; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h computerpets-redis ping; do sleep 2; done"]
      containers:
        - name: computerpets
          image: ghcr.io/richeyworks/computerpets:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: computerpets-config
            - secretRef:
                name: computerpets-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
