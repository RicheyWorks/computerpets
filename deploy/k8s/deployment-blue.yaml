apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-blue
  namespace: computerpets
  labels:
    app: computerpets
    color: blue
spec:
  # Local/dev count. The prod floor is deploy/k8s/hpa.yaml (ADR 0078),
  # which is not applied by the kustomization.
  replicas: 2
  selector:
    matchLabels:
      app: computerpets
      color: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: computerpets
        color: blue
    spec:
      # Hard hostname spread (ADR 0080, hardened by ADR 0100). Hard zone
      # spread (ADR 0095). Both items are DoNotSchedule, maxSkew 1,
      # nodeAffinityPolicy Honor, nodeTaintsPolicy Honor. No minDomains.
      # On two or more pool hostnames that can take a pod, this color
      # cannot place every pod on one node. One hostname still schedules:
      # minDomains is unset, so it behaves as 1, and the only domain keeps
      # skew at 1. Hard spread does not invent a second node. The second
      # local replica is not left Pending by this item. Required hostname
      # anti-affinity is not set. That rule would leave the second pod
      # Pending on one node. Do not set minDomains. That would treat the
      # missing hostname as an empty domain and leave the second pod
      # Pending on a laptop that has only one hostname.
      # The zone item uses the same action on topology.kubernetes.io/zone.
      # One labeled zone still schedules. A node that omits that label is
      # skipped. Kind and minikube omit it unless a human sets one zone
      # value. Do not set minDomains on the zone item either.
      # Pool pin (ADR 0093). nodeSelector requires kubernetes.io/os=linux
      # and computerpets/node-pool=api, the label the node pool already
      # sets. Both spread items set nodeAffinityPolicy Honor so a node
      # that fails that selector is not an empty domain. Kind and minikube
      # apply this file. Their nodes omit the pool label unless a human
      # adds it, so these pods stay Pending.
      # Do not delete the pool key to make a laptop apply schedule.
      # One labeled node still schedules both replicas when that node also
      # carries one zone label.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          nodeAffinityPolicy: Honor
          labelSelector:
            matchLabels:
              app: computerpets
              color: blue
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      # API pool taint (ADR 0094). Matches computerpets/node-pool=api:NoSchedule
      # on the node group. A toleration does not require the taint. Kind
      # and minikube are not tainted. Do not taint a kind or minikube node.
      tolerations:
        - key: computerpets/node-pool
          operator: Equal
          value: api
          effect: NoSchedule
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h computerpets-postgres -U computerpets -d computerpets; do sleep 2; done"]
        - name: wait-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h computerpets-redis ping; do sleep 2; done"]
      containers:
        - name: computerpets
          image: ghcr.io/richeyworks/computerpets:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: computerpets-config
            - secretRef:
                name: computerpets-secrets
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
