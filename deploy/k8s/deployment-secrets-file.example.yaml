# Example: project computerpets-secrets as files + NAME_FILE (NOT in kustomization).
#
# Prod path alternative to envFrom of a hand-filled Opaque Secret (ADR 0064).
# Prefer External Secrets Operator (external-secret.example.yaml) to *fill*
# computerpets-secrets, then either keep envFrom + COMPUTERPETS_SECRETS_SOURCE=
# external-secrets, or mount keys as files as shown here.
#
# This file is documentation scaffolding. Copy the env + volume bits into
# deployment-blue / deployment-green (or a strategic merge patch) after the
# Secret exists. Do not invent secret values in git.
#
# Deny-safe: missing *_FILE path → SecretFileEnvironmentPostProcessor refuses
# start. ProductionProfileGuard requires COMPUTERPETS_SECRETS_SOURCE=file and
# all four critical *_FILE paths when this shape is used.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: computerpets-blue
  namespace: computerpets
spec:
  template:
    spec:
      containers:
        - name: computerpets
          env:
            - name: COMPUTERPETS_SECRETS_SOURCE
              value: file
            - name: LICENSE_SECRET_KEY_FILE
              value: /var/run/secrets/computerpets/LICENSE_SECRET_KEY
            - name: JWT_SECRET_KEY_FILE
              value: /var/run/secrets/computerpets/JWT_SECRET_KEY
            - name: BUNDLE_SIGNING_KEY_FILE
              value: /var/run/secrets/computerpets/BUNDLE_SIGNING_KEY
            - name: ADMIN_API_KEY_FILE
              value: /var/run/secrets/computerpets/ADMIN_API_KEY
            # Optional: also file-mount the JDBC password
            # - name: SPRING_DATASOURCE_PASSWORD_FILE
            #   value: /var/run/secrets/computerpets/SPRING_DATASOURCE_PASSWORD
          volumeMounts:
            - name: house-secrets
              mountPath: /var/run/secrets/computerpets
              readOnly: true
      volumes:
        - name: house-secrets
          secret:
            secretName: computerpets-secrets
            # Keys become files named after the Secret data keys.
