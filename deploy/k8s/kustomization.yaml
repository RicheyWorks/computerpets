apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: computerpets
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - deployment-blue.yaml
  - deployment-green.yaml
  - service.yaml
# ingress.yaml (HTTP, local/dev) and ingress-tls.yaml (public HTTPS, ADR 0077)
# are optional. Neither is applied by this kustomization.
# hpa.yaml (prod API autoscaler, ADR 0078) is also not applied here.
# pdb.yaml (prod API disruption budget, ADR 0079) is also not applied here.
# Local/dev stays blue replicas 2, green replicas 0. Do not apply pdb.yaml
# on that shape: minAvailable 2 with only 2 pods blocks every voluntary eviction.
# Hostname spread (ADR 0080, hardened by ADR 0100) is DoNotSchedule on
# kubernetes.io/hostname, maxSkew 1, nodeAffinityPolicy Honor,
# nodeTaintsPolicy Honor, on both API pod templates.
# One hostname still schedules: a single domain keeps skew at 1.
# The second local replica is not left Pending by this item.
# Kind and minikube with one eligible hostname still run both blue
# replicas on that node. Hard spread does not invent a second node.
# Required hostname anti-affinity is not set.
# Do not set minDomains. That would leave the second pod Pending on a
# laptop that has only one hostname.
# API hostname floor (ADR 0105, single-zone floor ADR 0106) is the node
# pool, not this apply. min_size is 3 per zone. One Ready zone is three
# hostnames, so the HPA floor of 3 is 1 and 1 and 1. Kind and minikube
# do not plan that pool. One hostname here still schedules. Do not set
# minDomains.
# HPA ceiling (ADR 0107, one Ready zone ADR 0108) is 3, the same
# count as this floor. One Ready zone holds that ceiling at one pod
# per hostname. The ADR 0107 ceiling of 6 stacked 2, 2, and 2 on
# that zone and is refused. Raising min_size to keep a higher
# ceiling is refused. This apply does not include hpa.yaml.
# One hostname here still schedules. Do not set minDomains.
# Zone spread (ADR 0081, hardened by ADR 0095) is DoNotSchedule on
# topology.kubernetes.io/zone, maxSkew 1, nodeAffinityPolicy Honor.
# One labeled zone still schedules: a single domain keeps skew at 1.
# A node that omits topology.kubernetes.io/zone does not. Kind and
# minikube omit that label unless a human sets one zone value. Do not
# set minDomains. This apply does not create zones.
# API pool pin (ADR 0093) is on both pod templates, so this apply includes
# it. nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api. nodeAffinityPolicy is Honor. Kind and
# minikube nodes omit the pool label unless a human adds it. The API pods
# stay Pending until then. Do not delete the pool key to make a laptop
# apply schedule. Postgres and Redis stay unpinned.
# API pool taint (ADR 0094) is the toleration on both pod templates, so
# this apply includes it. The taint itself is the node group, not this
# apply. Kind and minikube nodes are not tainted.
# aws-node and kube-proxy toleration (ADR 0096) is not this apply.
# vpc-cni configuration_values and the kube-proxy patch live under
# deploy/terraform. Do not run that patch on kind or minikube.
# A toleration does not require the taint.
# Do not taint a kind or minikube node.
# Labeling a node computerpets/node-pool=api without that taint still
# schedules the API once that node also carries one
# topology.kubernetes.io/zone value (ADR 0095). A pool label alone
# leaves the API Pending. Postgres and Redis do not tolerate the taint.
# Multi-AZ workers are the node pool (ADR 0082), not this apply.
# cluster-autoscaler.yaml (ADR 0083, ADR 0090, ADR 0091, ADR 0092,
# ADR 0099, ADR 0101, ADR 0102, ADR 0103, ADR 0104, ADR 0109, ADR 0110) is also not applied here. Kind and
# minikube set enable_node_pool=false and do not install the scaler,
# its zone spread, or its disruption budget. That Deployment is two
# replicas with leader election. The standby is not the scaler. The
# scheduled leader raises desired capacity on the underfilled zone's
# group. --salvo-scale-up=true runs another scale-up in that same
# loop when the first least-waste choice was a different group.
# The 1m budget stays. A budget that is already gone, a failed
# snapshot update, or a scale-up that is not successful ends the
# salvo. The next main loop is the retry (ADR 0103).
# Each zone's node-group max is 20 (ADR 0104). The leader reads that
# as the Auto Scaling group MaxSize. The one-zone floor under that
# cap is 8 (ADR 0109). The live set binds on min_size 3, so
# MaxLimitReached at 20 is unreachable in this design. A Pending
# replica never holds the lease. The Running leader remains the
# scaler (ADR 0110). Kind and minikube do not apply this file.
# The zone item is DoNotSchedule on
# topology.kubernetes.io/zone, maxSkew 1. One labeled zone still
# schedules. A node that omits the zone label does not. Do not set
# minDomains. Required zone anti-affinity is not set. The budget is
# minAvailable 1.
# metrics-server.yaml (ADR 0084, ADR 0085, ADR 0086, ADR 0087, ADR 0088,
# ADR 0089, ADR 0098, ADR 0111, ADR 0112) is also not applied here. The
# serving cert chains to APIService caBundle and its DNS SAN is
# metrics-server.kube-system.svc. Kind and minikube do not apply that
# cert. The kubelet CA ConfigMap is written only after each supplied
# leaf chains to it (ADR 0112). Kind and minikube do not apply that CA.
# Its zone item is DoNotSchedule on
# topology.kubernetes.io/zone, maxSkew 1. One labeled
# zone still schedules. A node that omits the zone label does not.
# Do not set minDomains. Kind and minikube do not apply the file.
# Its nodeSelector requires computerpets/node-pool=api.
# The Deployment in that file is two replicas. Kind and minikube do not
# install it. The HPA does not raise replicas until that API answers.
images:
  - name: ghcr.io/richeyworks/computerpets
    newTag: main
