# Prod API autoscaler (ADR 0078, ceiling ADR 0108). Not in kustomization.yaml.
# maxReplicas is 3: one Ready zone times min_size 3, and the HPA floor.
# That zone holds the ceiling at one pod per hostname. The ADR 0107
# ceiling of 6 stacked as 2, 2, and 2 on that zone and is refused.
# Raising min_size to keep a higher ceiling is refused. minReplicas stays 3.
# Local/dev `kubectl apply -k deploy/k8s` keeps computerpets-blue at
# replicas: 2 and computerpets-green at replicas: 0. There is no overlay
# directory. This file is the prod apply, same pattern as ingress-tls.yaml.
#
# Requires metrics-server (the metrics.k8s.io API). This file does not
# install it. Apply metrics-server.yaml first (ADR 0084, ADR 0085,
# ADR 0086, ADR 0087, ADR 0088, ADR 0098). That file is also outside this
# kustomization. It runs two replicas and hard-spreads zones (DoNotSchedule).
# One labeled zone still schedules. Do not set minDomains.
# It mounts the keeper's kubelet CA, and serves with the keeper's certificate.
# `kubectl
# top pods -n computerpets` must show cpu and memory. Until that API
# answers, applying this object does not raise the replica count, so blue
# can stay at 2.
#
# Targets computerpets-blue, the Service's default live color. Green is the
# idle slot (replicas: 0). A resource HPA cannot scale a deployment that
# has no pods. Postgres and Redis are not targets.
# After a cutover, patch scaleTargetRef to computerpets-green before
# scaling blue to 0. Re-applying this file points the autoscaler back at
# blue. Patch pdb.yaml onto that same color in the same cutover (ADR 0079).
# See deploy/k8s/README.md.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: computerpets
  namespace: computerpets
  labels:
    app: computerpets
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: computerpets-blue
  minReplicas: 3
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 800Mi
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
