# metrics-server so hpa.yaml can read CPU and memory (ADR 0084, ADR 0085,
# ADR 0086, ADR 0087, ADR 0088, ADR 0089).
# Not in kustomization.yaml. Local/dev `kubectl apply -k deploy/k8s` does
# not install this. Kind and minikube do not apply this file. There is no
# overlay directory. No Helm chart.
#
# The objects below this header start from upstream
# high-availability-1.21+.yaml v0.9.0:
# https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/high-availability-1.21+.yaml
# Image registry.k8s.io/metrics-server/metrics-server:v0.9.0 (Kubernetes
# 1.34+; release dependencies are 1.36.2, the same minor line as the
# Cluster Autoscaler image). Do not replace the tag with a floating tag.
# That release asset is components.yaml plus replicas 2, rollingUpdate
# maxUnavailable 1, required hostname pod anti-affinity, and an addon
# PodDisruptionBudget (minAvailable 1). It is not a second chart.
# The kubelet CA argument, volume, and volumeMount are additions
# (ADR 0086). The serving-cert arguments, volume, and volumeMount are
# additions (ADR 0087). insecureSkipTLSVerify is not set. Soft zone
# spread is an addition (ADR 0088). The nodeSelector pool pin is an
# addition (ADR 0089). None of those are in that upstream file.
#
# Apply this before hpa.yaml. The APIService is v1beta1.metrics.k8s.io.
# Until `kubectl top pods -n computerpets` shows cpu and memory, the HPA
# does not raise blue from 2 to 3.
#
# The apiserver verifies this addon's serving certificate.
# --tls-cert-file and --tls-private-key-file point at a read-only mount
# of Secret metrics-server-serving in kube-system (keys tls.crt and
# tls.key, optional: false). This file does not create that Secret and
# does not contain a certificate or a key. Create it before apply:
#   kubectl -n kube-system create secret generic metrics-server-serving \
#     --from-file=tls.crt=/path/to/tls.crt \
#     --from-file=tls.key=/path/to/tls.key \
#     --from-file=ca.crt=/path/to/serving-ca.crt
# The certificate DNS SAN must include metrics-server.kube-system.svc.
# That is the name the apiserver uses. --cert-dir=/tmp stays in the
# upstream arg list and is ignored while both files are set, so the
# process does not mint a serving cert in /tmp. Do not add
# insecureSkipTLSVerify. Do not add --kubelet-insecure-tls.
# Do not add --deprecated-kubelet-completely-insecure.
#
# A private CA is not a system root. After apply, set the APIService
# caBundle from that ca.crt. The field is base64. Do not commit it:
#   CA_B64="$(kubectl -n kube-system get secret metrics-server-serving \
#     -o jsonpath='{.data.ca\.crt}')"
#   kubectl patch apiservice v1beta1.metrics.k8s.io --type=merge \
#     -p "{\"spec\":{\"caBundle\":\"${CA_B64}\"}}"
# Until that field is the CA that signed tls.crt, the apiserver uses
# system roots and a private serving cert leaves kubectl top empty.
# A missing Secret leaves the pods unstarted.
#
# Kubelet verification uses
# --kubelet-certificate-authority=/etc/metrics-server/kubelet-ca/ca.crt.
# That path is a read-only mount of ConfigMap metrics-server-kubelet-ca
# in kube-system, key ca.crt, optional: false. This file does not create
# that object and does not contain a certificate. Create it before apply:
#   kubectl -n kube-system create configmap metrics-server-kubelet-ca \
#     --from-file=ca.crt=/path/to/kubelet-serving-ca.crt
# A Secret with the same name, key, and optional: false is the equivalent
# volume source when the bundle is already a Secret. hostPath is not.
# The flag replaces the in-cluster CA for kubelet scrapes. Put the CA
# that signed the kubelet serving certificates in that object. A
# certificate that does not chain to it still leaves kubectl top empty.
# A missing object leaves the pods unstarted.
#
# The Deployment sets replicas: 2. Anti-affinity is required on
# kubernetes.io/hostname, so the second pod stays Pending until a second
# node exists. Kind and minikube do not apply this file. The addon budget
# is not pdb.yaml.
#
# Zone spread (ADR 0088) sits beside that hostname rule. The constraint
# is topology.kubernetes.io/zone, maxSkew 1, whenUnsatisfiable
# ScheduleAnyway, nodeTaintsPolicy Honor. It prefers a different zone
# and still binds when every schedulable node is in one zone or omits
# the zone label. It is not a required zone anti-affinity. That required
# rule would leave the second pod Pending on a single-zone cluster.
# DoNotSchedule is not set, for the same reason.
#
# Pool pin (ADR 0089). nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api. That second label is the one
# modules/node_pool already sets on each multi-AZ group. It is required,
# not a preferred node affinity. A preference would still admit other
# linux nodes. nodeAffinityPolicy is Honor, so the soft zone rule counts
# only nodes that match this selector. Kind and minikube do not apply
# this file. enable_node_pool=false does not label their nodes. Applying
# this file there leaves both pods Pending. That is the feature-off path.
# A single-zone cluster whose nodes do carry the label still schedules
# both pods when two hostnames exist, because zone spread stays
# ScheduleAnyway. The API Deployments select the same label (ADR 0093).
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: system:aggregated-metrics-reader
rules:
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
rules:
- apiGroups:
  - ""
  resources:
  - nodes/metrics
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  ports:
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                k8s-app: metrics-server
            namespaces:
            - kube-system
            topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        nodeTaintsPolicy: Honor
        nodeAffinityPolicy: Honor
        labelSelector:
          matchLabels:
            k8s-app: metrics-server
      containers:
      - args:
        - --cert-dir=/tmp
        - --tls-cert-file=/etc/metrics-server/serving/tls.crt
        - --tls-private-key-file=/etc/metrics-server/serving/tls.key
        - --secure-port=10250
        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        - --kubelet-certificate-authority=/etc/metrics-server/kubelet-ca/ca.crt
        image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: metrics-server
        ports:
        - containerPort: 10250
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp-dir
        - mountPath: /etc/metrics-server/kubelet-ca
          name: kubelet-ca
          readOnly: true
        - mountPath: /etc/metrics-server/serving
          name: serving-cert
          readOnly: true
      # ADR 0089. Both keys are required. The pool label is the one
      # modules/node_pool sets. Kind and minikube omit it and do not
      # apply this file.
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      priorityClassName: system-cluster-critical
      serviceAccountName: metrics-server
      volumes:
      - emptyDir: {}
        name: tmp-dir
      - name: kubelet-ca
        configMap:
          name: metrics-server-kubelet-ca
          optional: false
          items:
          - key: ca.crt
            path: ca.crt
      - name: serving-cert
        secret:
          secretName: metrics-server-serving
          optional: false
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  service:
    name: metrics-server
    namespace: kube-system
  version: v1beta1
  versionPriority: 100
