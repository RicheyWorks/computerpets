# metrics-server so hpa.yaml can read CPU and memory (ADR 0084, ADR 0085,
# ADR 0086, ADR 0087, ADR 0088, ADR 0089, ADR 0098, ADR 0111, ADR 0112,
# ADR 0113).
# Not in kustomization.yaml. Local/dev `kubectl apply -k deploy/k8s` does
# not install this. Kind and minikube do not apply this file. There is no
# overlay directory. No Helm chart.
#
# The objects below this header start from upstream
# high-availability-1.21+.yaml v0.9.0:
# https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/high-availability-1.21+.yaml
# Image registry.k8s.io/metrics-server/metrics-server:v0.9.0 (Kubernetes
# 1.34+; release dependencies are 1.36.2, the same minor line as the
# Cluster Autoscaler image). Do not replace the tag with a floating tag.
# That release asset is components.yaml plus replicas 2, rollingUpdate
# maxUnavailable 1, required hostname pod anti-affinity, and an addon
# PodDisruptionBudget (minAvailable 1). It is not a second chart.
# The kubelet CA argument, volume, and volumeMount are additions
# (ADR 0086). The serving-cert arguments, volume, and volumeMount are
# additions (ADR 0087). insecureSkipTLSVerify is not set. Zone
# spread is an addition (ADR 0088), hardened to DoNotSchedule
# (ADR 0098). The nodeSelector pool pin is an
# addition (ADR 0089). None of those are in that upstream file.
#
# Apply this before hpa.yaml. The APIService is v1beta1.metrics.k8s.io.
# Until `kubectl top pods -n computerpets` shows cpu and memory, the HPA
# does not raise blue from 2 to 3.
#
# The apiserver verifies this addon's serving certificate.
# --tls-cert-file and --tls-private-key-file point at a read-only mount
# of Secret metrics-server-serving in kube-system (keys tls.crt and
# tls.key, optional: false). This file does not create that Secret and
# does not contain a certificate or a key. Create it before apply:
#   kubectl -n kube-system create secret generic metrics-server-serving \
#     --from-file=tls.crt=/path/to/tls.crt \
#     --from-file=tls.key=/path/to/tls.key \
#     --from-file=ca.crt=/path/to/serving-ca.crt
# The certificate DNS SAN must be metrics-server.kube-system.svc.
# That is the name the apiserver uses. A cluster.local name is not
# a substitute. --cert-dir=/tmp stays in the upstream arg list and is
# ignored while both files are set, so the process does not mint a
# serving cert in /tmp. Do not add insecureSkipTLSVerify. Do not add
# --kubelet-insecure-tls. Do not add
# --deprecated-kubelet-completely-insecure.
#
# ADR 0111 mints that leaf and the private CA, then refuses apply
# unless the leaf chains to ca.crt and the SAN is that name. The
# same apply writes Secret metrics-server-serving and patches
# APIService caBundle from that ca.crt. Do not commit the certificate,
# the key, or caBundle. A missing Secret leaves the pods unstarted.
#   OUT="$(mktemp -d)"
#   ./deploy/k8s/metrics-server-serving-cert.sh render "$OUT"
#   COMPUTERPETS_METRICS_SERVING_APPLY=1 \
#     ./deploy/k8s/metrics-server-serving-cert.sh apply "$OUT"
#
# Kubelet verification uses
# --kubelet-certificate-authority=/etc/metrics-server/kubelet-ca/ca.crt.
# That path is a read-only mount of ConfigMap metrics-server-kubelet-ca
# in kube-system, key ca.crt, optional: false. This file does not create
# that object and does not contain a certificate.
# ADR 0112 writes that ConfigMap only after every supplied kubelet leaf
# chains to ca.crt. A missing CA, a swapped CA, or --kubelet-insecure-tls
# refuses apply before kubectl. Kind and minikube do not receive it.
# Do not commit the certificate. A missing object leaves the pods unstarted.
#   OUT="$(mktemp -d)"
#   # keeper copies ca.crt and kubelet.crt (and kubelet-*.crt) into "$OUT"
#   ./deploy/k8s/metrics-server-kubelet-ca.sh verify "$OUT"
#   COMPUTERPETS_METRICS_KUBELET_CA_APPLY=1 \
#     ./deploy/k8s/metrics-server-kubelet-ca.sh apply "$OUT"
# ADR 0113 writes that ConfigMap only after each node file set's leaf
# SAN covers the dial address. The order is InternalIP, then ExternalIP,
# then Hostname. The script does not connect to a node. Kind and
# minikube do not receive it.
#   OUT="$(mktemp -d)"
#   # keeper copies ca.crt and nodes/<name>/{kubelet.crt,addresses}
#   ./deploy/k8s/metrics-server-kubelet-san.sh verify "$OUT"
#   COMPUTERPETS_METRICS_KUBELET_SAN_APPLY=1 \
#     ./deploy/k8s/metrics-server-kubelet-san.sh apply "$OUT"
# A Secret with the same name, key, and optional: false is the equivalent
# hand substitution when the bundle is already a Secret. This apply writes
# the ConfigMap the manifest mounts. hostPath is not.
# The flag replaces the in-cluster CA for kubelet scrapes. A certificate
# that does not chain to that CA is not written. Do not add
# --kubelet-insecure-tls.
#
# The Deployment sets replicas: 2. Anti-affinity is required on
# kubernetes.io/hostname, so the second pod stays Pending until a second
# node exists. Kind and minikube do not apply this file. The addon budget
# is not pdb.yaml.
#
# Zone spread (ADR 0088, hardened by ADR 0098) sits beside that
# hostname rule. The constraint is topology.kubernetes.io/zone,
# maxSkew 1, whenUnsatisfiable DoNotSchedule, nodeTaintsPolicy Honor,
# nodeAffinityPolicy Honor. minDomains is unset. Do not set minDomains.
# On two or more labeled zones that can take a pod, the two replicas
# cannot share one zone. One labeled zone still schedules: unset
# minDomains behaves as 1, so the only domain keeps skew at 1. Hard
# spread does not invent a second zone. A node that omits
# topology.kubernetes.io/zone is skipped, so both pods stay Pending
# until that label exists. Kind and minikube do not apply this file.
# There is no required zone anti-affinity. That required rule would
# leave the second pod Pending when every node shares one zone.
#
# Pool pin (ADR 0089). nodeSelector requires kubernetes.io/os=linux and
# computerpets/node-pool=api. That second label is the one
# modules/node_pool already sets on each multi-AZ group. It is required,
# not a preferred node affinity. A preference would still admit other
# linux nodes. nodeAffinityPolicy is Honor, so the soft zone rule counts
# only nodes that match this selector. Kind and minikube do not apply
# this file. enable_node_pool=false does not label their nodes. Applying
# this file there leaves both pods Pending. That is the feature-off path.
# A pool label without topology.kubernetes.io/zone also leaves both pods
# Pending, because DoNotSchedule skips a node that omits the zone label.
# A single-zone cluster whose nodes carry the pool label and one zone
# value still schedules both pods when two hostnames exist. One domain
# keeps skew at 1. One node still leaves the second pod Pending on the
# hostname rule. The API Deployments select the same label (ADR 0093).
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: system:aggregated-metrics-reader
rules:
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
rules:
- apiGroups:
  - ""
  resources:
  - nodes/metrics
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: metrics-server
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
- kind: ServiceAccount
  name: metrics-server
  namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  ports:
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    k8s-app: metrics-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: metrics-server
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                k8s-app: metrics-server
            namespaces:
            - kube-system
            topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        nodeAffinityPolicy: Honor
        labelSelector:
          matchLabels:
            k8s-app: metrics-server
      containers:
      - args:
        - --cert-dir=/tmp
        - --tls-cert-file=/etc/metrics-server/serving/tls.crt
        - --tls-private-key-file=/etc/metrics-server/serving/tls.key
        - --secure-port=10250
        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        - --kubelet-certificate-authority=/etc/metrics-server/kubelet-ca/ca.crt
        image: registry.k8s.io/metrics-server/metrics-server:v0.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: metrics-server
        ports:
        - containerPort: 10250
          name: https
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp-dir
        - mountPath: /etc/metrics-server/kubelet-ca
          name: kubelet-ca
          readOnly: true
        - mountPath: /etc/metrics-server/serving
          name: serving-cert
          readOnly: true
      # ADR 0089. Both keys are required. The pool label is the one
      # modules/node_pool sets. Kind and minikube omit it and do not
      # apply this file.
      nodeSelector:
        kubernetes.io/os: linux
        computerpets/node-pool: api
      # API pool taint (ADR 0094). Kind and minikube do not apply this file.
      tolerations:
        - key: computerpets/node-pool
          operator: Equal
          value: api
          effect: NoSchedule
      priorityClassName: system-cluster-critical
      serviceAccountName: metrics-server
      volumes:
      - emptyDir: {}
        name: tmp-dir
      - name: kubelet-ca
        configMap:
          name: metrics-server-kubelet-ca
          optional: false
          items:
          - key: ca.crt
            path: ca.crt
      - name: serving-cert
        secret:
          secretName: metrics-server-serving
          optional: false
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    k8s-app: metrics-server
  name: metrics-server
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  labels:
    k8s-app: metrics-server
  name: v1beta1.metrics.k8s.io
spec:
  group: metrics.k8s.io
  groupPriorityMinimum: 100
  service:
    name: metrics-server
    namespace: kube-system
  version: v1beta1
  versionPriority: 100
