# Fail-hard production shape. Same keys as staging; ProductionProfileGuard
# then refuses to start if env overrides turn Microsoft dev-mode on, switch
# the rate-limit store to memory, point the datasource at H2, inject
# house crypto via plain env Secret without COMPUTERPETS_SECRETS_SOURCE
# (external-secrets | file | vault-agent), or leave a set
# COMPUTERPETS_KEYS_ROTATED_AT stamp older than 400 days. See ADR 0064 / 0065.
# Missing SPRING_DATASOURCE_* fails placeholder resolution before the guard.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Surface borrowed-connection leaks in production logs (60s).
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
    replica:
      hikari:
        leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false

microsoft:
  # collections-url stays the v9 publisherQuery default from application.yml.
  # ProductionProfileGuard refuses MICROSOFT_DEV_MODE=true even if env overrides this.
  dev-mode: false

rate-limit:
  backend: redis

# Fail-closed unless the operator lists LB / ingress CIDRs (ADR 0067).
trusted-proxies:
  cidrs: ${TRUSTED_PROXY_CIDRS:}
