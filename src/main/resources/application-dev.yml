# Local laptop and docker-compose (compose already sets SPRING_PROFILES_ACTIVE=dev
# and overrides the datasource to Postgres via SPRING_DATASOURCE_*).
# Bare `mvn spring-boot:run -Dspring-boot.run.profiles=dev` keeps H2 from application.yml.
spring:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true

# Allowed here only. Leave unset unless you are on a laptop without Xbox tokens.
microsoft:
  dev-mode: ${MICROSOFT_DEV_MODE:false}

# Redis is still the default from application.yml. RATE_LIMIT_BACKEND=memory is
# allowed in this profile for a single local process (not for compose replicas).

# Loopback may present X-Forwarded-For / Forwarded (ADR 0067). Override with
# TRUSTED_PROXY_CIDRS when a local reverse proxy sits in front.
trusted-proxies:
  cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}

# The web /admin page on this computer (http://localhost:8080 from `npm run dev`) calls
# /api/admin/** on :8081, another origin. Loopback pages on any port may do so here only.
# The base default is closed; prod refuses "*" (ProductionProfileGuard). Every call is still HMAC-signed.
admin:
  allowed-origins: "${ADMIN_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://[::1]:[*]}"
