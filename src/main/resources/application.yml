# Shared defaults. Profile overlays (same YAML + env style, no second format):
#   application-dev.yml      — local / docker-compose (H2 unless SPRING_DATASOURCE_* is set)
#   application-staging.yml  — Postgres + Redis; microsoft.dev-mode off in the file
#   application-prod.yml     — same shape, plus ProductionProfileGuard fail-hard
# Activate with SPRING_PROFILES_ACTIVE. Tests and bare `mvn spring-boot:run` use this file only.
# The desk keeps 8080 (live-preview contract). Java sits at 8081 so a keeper
# can sit at both doors. They do not share one.
server:
  port: 8081
  # server.ssl stays off (ADR 0077). No keystore. Pod and local stay HTTP.
  # Public TLS terminates at ingress-tls.yaml or the ALB HTTPS listener.
  ssl:
    enabled: false

# Public API listener TLS (ADR 0077). Default off: local, compose, and the
# in-cluster Service stay HTTP on 8081. When the flag is on, prod requires
# API_PUBLIC_BASE_URL to be an https origin on port 443. Do not set a keystore.
api-listener:
  tls-required: ${API_LISTENER_TLS_REQUIRED:false}
  public-base-url: ${API_PUBLIC_BASE_URL:}

spring:
  application:
    name: enterprisepet-backend
  autoconfigure:
    # Boot 3.3's OTLP auto-config always dials localhost:4318. We register our
    # own SpanExporter that is a no-op unless OTEL_EXPORTER_OTLP_ENDPOINT is set.
    exclude: org.springframework.boot.actuate.autoconfigure.tracing.otlp.OtlpTracingAutoConfiguration
  datasource:
    url: jdbc:h2:mem:enterprisepet
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # HikariCP — documented defaults for a small license service (ARCHITECTURE 3.2).
    # Override with HIKARI_* env vars. Staging/prod raise leak-detection-threshold.
    hikari:
      pool-name: computerpets-primary
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:1000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:0}
    # Optional Postgres read replica. Blank = primary only (default).
    # Do not invent a cloud replica URL. When set, Spring Data read-only
    # transactions route here; writes always stay on primary. The replica
    # pool is forced JDBC read-only (deny-safe). See ADR 0059.
    replica:
      url: ${SPRING_DATASOURCE_REPLICA_URL:}
      username: ${SPRING_DATASOURCE_REPLICA_USERNAME:}
      password: ${SPRING_DATASOURCE_REPLICA_PASSWORD:}
      hikari:
        pool-name: computerpets-replica
        maximum-pool-size: ${HIKARI_REPLICA_MAXIMUM_POOL_SIZE:10}
        minimum-idle: ${HIKARI_REPLICA_MINIMUM_IDLE:2}
        connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:3000}
        validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:1000}
        idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
        max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
        leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:0}
    # Transit TLS for managed RDS (ADR 0076). Default off: local H2, compose,
    # and in-cluster Postgres stay cleartext. Prod refuses a half-set pair.
    # verify-full only when POSTGRES_SSL_ROOT_CERT names a PEM CA bundle.
    ssl-required: ${POSTGRES_SSL_REQUIRED:false}
    ssl-root-cert: ${POSTGRES_SSL_ROOT_CERT:}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages the schema; Hibernate should only validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# License master key: 32 random bytes, base64-encoded (RFC 4648).
#
# IMPORTANT:
# - There is no default value. You MUST set LICENSE_SECRET_KEY.
# - If the value matches the previously committed default key, the application
#   will refuse to start (except when the 'test' profile is active).
#
# Generate a key with:
#   openssl rand -base64 32
#
# It is strongly recommended to always provide this via environment variable,
# even during local development.
# secret-key-previous is optional dual-key decrypt material during rotation (ADR 0065).
license:
  secret-key: "${LICENSE_SECRET_KEY:}"
  secret-key-previous: "${LICENSE_SECRET_KEY_PREVIOUS:}"
  # The same string (UTF-8) is the HMAC key for POST /api/verify machine
  # signatures (ADR 0070). Not a second secret. Previous verifies only.

steam:
  api-key: "YOUR_STEAM_WEB_API_KEY"
  # Base URL for Steam Web API. Override in tests with WireMock or in different environments.
  api-base-url: "https://api.steampowered.com"
  # Do not invent a live ComputerPets AppID; leave app-id empty until one exists.
  # Empty fails closed — owning any Steam game does not open the house.
  # Comma or whitespace makes an allowlist when more than one door is real.
  app-id: "${STEAM_APP_ID:}"

# itch.io developer API key (https://itch.io/user/settings/api-keys).
# Placeholder is rejected at verify time — never treated as a valid receipt.
# Do not invent a live ComputerPets game id; leave game-id empty until one exists.
itch:
  api-key: "${ITCH_API_KEY:YOUR_ITCH_API_KEY}"
  api-base-url: "https://api.itch.io"
  game-id: "${ITCH_GAME_ID:}"

# Epic Games Store / EOS Ecom Web API (https://dev.epicgames.com/docs/web-api-ref/ecom-web-apis).
# Placeholders are rejected at verify time — never treated as owned.
# Requires a Developer Portal Trusted Server client with the Ecom feature.
# Do not invent a live ComputerPets sandbox or catalog item id.
epic:
  client-id: "${EPIC_CLIENT_ID:YOUR_EPIC_CLIENT_ID}"
  client-secret: "${EPIC_CLIENT_SECRET:YOUR_EPIC_CLIENT_SECRET}"
  deployment-id: "${EPIC_DEPLOYMENT_ID:YOUR_EPIC_DEPLOYMENT_ID}"
  api-base-url: "https://api.epicgames.dev"
  sandbox-id: "${EPIC_SANDBOX_ID:}"
  catalog-item-id: "${EPIC_CATALOG_ITEM_ID:}"

# -----------------------------------------------------------------------------
# Ownership Provider Configuration
# -----------------------------------------------------------------------------
# Use these toggles to enable or disable individual ownership providers.
# This is useful for:
#   - Disabling a provider during development
#   - Gradually rolling out new providers
#   - Running without certain external dependencies
#
# All providers default to enabled (matchIfMissing = true).
ownership:
  providers:
    steam:
      enabled: true
    microsoft:
      enabled: true
    nft:
      enabled: true
    itch:
      enabled: true
    epic:
      enabled: true

ethereum:
  rpc-url: "${ETHEREUM_RPC_URL:https://eth-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_KEY}"
  # Deny any contract that is not listed under collections. Leave collections
  # empty until the ComputerPets ERC-721/1155 is deployed — verify will then
  # return 403 "no official NFT collections configured" instead of issuing a
  # license for a random CryptoKitty.
  request-timeout-ms: 4000
  allowlist-required: true
  # Naming a wallet is not enough. personal_sign must prove the keeper
  # holds the keys. Fail closed — like the empty Steam and Store doors.
  require-signature: true
  collections: []
  # Example once a collection is live:
  # collections:
  #   - address: "0xYourOfficialComputerPetsContract"
  #     standard: ERC721          # ERC721 | ERC1155 | AUTO
  #     name: "ComputerPets Genesis"
  #     tokens:
  #       1: red_panda
  #       2: dragon


microsoft:
  # "consumers" for personal Microsoft accounts, or a tenant GUID for AAD.
  tenant: "consumers"
  # Collections Query v9 publisherQuery. Override in tests (WireMock) or a sandbox.
  collections-url: "https://collections.mp.microsoft.com/v9.0/collections/publisherQuery"
  # Do not invent a live ComputerPets Store product id; leave product-id empty until one exists.
  # Empty fails closed — owning any Microsoft Store product does not open the house.
  # Comma or whitespace makes an allowlist when more than one door is real.
  product-id: "${MICROSOFT_PRODUCT_ID:}"
  # dev-mode bypasses the real Microsoft Collections API. The house door still applies.
  # NEVER enable outside local development. ProductionProfileGuard
  # refuses this flag when spring.profiles.active=prod.
  dev-mode: ${MICROSOFT_DEV_MODE:false}

# JWT auth — short-lived bearer token issued alongside the encrypted license.
# secret-key is REQUIRED; no default. Generate with: openssl rand -base64 48
# secret-key-previous is optional dual-key verify material during rotation (ADR 0065).
# The token carries jti. POST /api/download claims it once (ADR 0073).
jwt:
  secret-key: "${JWT_SECRET_KEY:}"
  secret-key-previous: "${JWT_SECRET_KEY_PREVIOUS:}"
  issuer: "enterprisepet-backend"
  ttl-minutes: 30

bundle:
  base-url: "${BUNDLE_BASE_URL:https://cdn.enterprisepet.example/bundles}"
  signing-key: "${BUNDLE_SIGNING_KEY:}"
  # Optional previous HMAC during a rotation window (ADR 0065). Sign uses signing-key only.
  signing-key-previous: "${BUNDLE_SIGNING_KEY_PREVIOUS:}"
  # Platform used when POST /api/download omits `platform` (or sends an
  # unsupported value). win | mac | linux | any
  default-platform: win
  # Artifact catalog. Empty = signed {petKey}.zip, no version/sha256 claim.
  # That is the right default until a zip is published. Unknown petKey,
  # placeholder sha256, or a duplicate petKey+platform fail startup.
  # Do not invent hashes for files that do not exist.
  catalog: []
  # Example only — the sha256 below is test/example data, not a live object:
  # catalog:
  #   - petKey: red_panda
  #     version: "1.0.0"
  #     platform: win
  #     sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  #     path: red_panda-win-1.0.0.zip

# Admin HMAC key for /api/admin/** (ADR 0071). Not sent as a header.
# Must be a strong random value. Generate: openssl rand -base64 32
# api-key-previous verifies during a rotation window (ADR 0065).
admin:
  api-key: "${ADMIN_API_KEY:}"
  api-key-previous: "${ADMIN_API_KEY_PREVIOUS:}"
  # Browser origins allowed to call /api/admin/** (CORS preflight only; every call is still HMAC-signed).
  # Comma-separated, e.g. ADMIN_ALLOWED_ORIGINS=https://<your web site>. Default empty: no other web
  # site may call (same-origin pages still work). The dev profile allows loopback pages; prod refuses "*".
  allowed-origins: "${ADMIN_ALLOWED_ORIGINS:}"

# -----------------------------------------------------------------------------
# Rate limiting (Phase 3.1)
# -----------------------------------------------------------------------------
# Default store is Redis so every app replica shares the same per-IP buckets
# (10/min verify, 30/min download), the jti deny-list, signed-request
# nonces (replay:nonce:*, 300s), and single-use download JWTs
# (download:jwt:{jti}, ADR 0073). If Redis is down
# the rate-limit filter fail-closes with HTTP 503 + Retry-After — it does
# not silently lift the limit. License validate then falls back to Postgres.
# Set RATE_LIMIT_BACKEND=memory only for tests or a single local process.
# Per-IP defaults live in RateLimitingFilter (not env-tunable capacities):
#   verify 10/min, download 30/min (grant issue), discovery 60/min on /api/pets,
#   bundles 60/min on GET /api/bundles/{petKey}. Signed /redeem is excluded (ADR 0069).
# Edge gate in front of these buckets is the regional WAF on the API ALB (ADR 0074).
# Capacities stay in RateLimitingFilter, not in a Terraform rate variable.
rate-limit:
  backend: ${RATE_LIMIT_BACKEND:redis}
  fail-closed-retry-after-seconds: ${RATE_LIMIT_FAIL_CLOSED_RETRY_AFTER:5}
  redis:
    # Single shared Lettuce connection (not a Hikari-style pool). Timeout is
    # the pool-tuning knob for rate-limit / jti deny-list / download grants.
    # Password and TLS are optional (ADR 0075). Unset keeps compose / in-cluster
    # Redis AUTH-less and cleartext. Prod refuses a half-set trio.
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:200ms}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    auth-required: ${REDIS_AUTH_REQUIRED:false}

# -----------------------------------------------------------------------------
# Trusted proxies (client IP / X-Forwarded-For)
# -----------------------------------------------------------------------------
# Fail-closed: X-Forwarded-For and Forwarded are honoured only when remoteAddr
# matches one of these CIDRs. Empty = always use remoteAddr (spoof-safe).
# Local/dev profile defaults to loopback; prod stays empty until the operator
# lists the load balancer / ingress ranges (TRUSTED_PROXY_CIDRS). See ADR 0067.
trusted-proxies:
  cidrs: ${TRUSTED_PROXY_CIDRS:}

# -----------------------------------------------------------------------------
# Observability (Phase 1 + 3.2)
# -----------------------------------------------------------------------------
# Tracing uses Micrometer Observation + the OpenTelemetry bridge (Spring Boot 3.5).
# Spans are always created in-process. OTLP export is OFF unless
# OTEL_EXPORTER_OTLP_ENDPOINT (base URL, e.g. http://localhost:4318) or
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (full /v1/traces URL) is set.
# Local/dev starts without a collector.
# /actuator/prometheus and /actuator/info need their own scrape bearer
# (METRICS_SCRAPE_TOKEN or METRICS_SCRAPE_TOKEN_FILE, 32+ chars). A customer
# download JWT is not enough. Unset = nobody scrapes; health stays open (ADR 0133).
metrics:
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Public /actuator/health is a door, not a floor plan. Never dump rooms.
      show-details: never
      show-components: never
      probes:
        enabled: true   # Enables /actuator/health/liveness and /readiness for Kubernetes
  health:
    defaults:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    distribution:
      percentiles-histogram:
        enterprisepet.verify: true
        enterprisepet.license.issue: true
        enterprisepet.download: true
        http.server.requests: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.enterprisepet

# -----------------------------------------------------------------------------
# Resilience4j (Phase 2.3) — defaults for the ownership providers
# -----------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      steam:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      microsoft:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      nft:
        slidingWindowSize: 8
        minimumNumberOfCalls: 4
        failureRateThreshold: 60
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2
      itch:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      epic:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      steam:
        maxAttempts: 3
        waitDuration: 500ms
      microsoft:
        maxAttempts: 3
        waitDuration: 500ms
      nft:
        maxAttempts: 2
        waitDuration: 300ms
      itch:
        maxAttempts: 3
        waitDuration: 500ms
      epic:
        maxAttempts: 3
        waitDuration: 500ms
  # Outer wall for one Steam / Itch / Epic / Microsoft ownership probe.
  # RestClient still owns the per-HTTP 10s connect+read. This caps stacked hops
  # (Epic token + ownership) and any hang past the socket deadline. Exceed denies.
  timelimiter:
    instances:
      ownership:
        timeoutDuration: 12s
        cancelRunningFuture: true
