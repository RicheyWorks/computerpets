# Shared-cluster shape without the prod fail-hard guard.
# Missing SPRING_DATASOURCE_* fails startup (no H2 fallback).
# MICROSOFT_DEV_MODE in the environment can still override the false below;
# that is intentional — staging is not prod.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
    replica:
      hikari:
        leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false

microsoft:
  dev-mode: false

rate-limit:
  backend: redis

# Empty = fail-closed (remoteAddr only). Set TRUSTED_PROXY_CIDRS to the
# staging load balancer / ingress ranges when XFF must be honoured (ADR 0067).
trusted-proxies:
  cidrs: ${TRUSTED_PROXY_CIDRS:}
