<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Minds — ComputerPets</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: #161412; color: #f2ece3; }
      main { padding: 20px 22px 28px; }
      h1 { font-size: 28px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.03em; }
      p.lead { color: #9a9288; margin: 0 0 18px; }
      label { display: block; margin: 12px 0 6px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9288; }
      select, input { width: 100%; box-sizing: border-box; height: 40px; border: 1px solid #2a2621; background: #1f1c19; color: #f2ece3; border-radius: 8px; padding: 0 10px; }
      button { margin-top: 16px; height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #c4a574; color: #161412; font-weight: 600; }
      .ok { margin-top: 12px; color: #9a9288; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Minds</h1>
      <p class="lead">Plug any AI into the overlay. Keys stay on this machine.</p>
      <label>Plugin</label>
      <select id="plugin"></select>
      <label>Model</label>
      <input id="model" />
      <label>Base URL</label>
      <input id="base" />
      <label>API key</label>
      <input id="key" type="password" autocomplete="off" />
      <button id="save" type="button">Save house default</button>
      <p class="ok" id="ok"></p>
    </main>
    <script src="mind.js"></script>
    <script>
      const s = window.PetMind.load();
      const plugin = document.getElementById("plugin");
      const model = document.getElementById("model");
      const base = document.getElementById("base");
      const key = document.getElementById("key");
      window.PetMind.PRESETS.forEach((p) => {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = p.name;
        plugin.appendChild(o);
      });
      function fill(id) {
        const p = window.PetMind.preset(id);
        plugin.value = id;
        model.value = s.default.model || p.model || "";
        base.value = s.default.baseUrl || p.base || "";
        key.value = s.default.apiKey || "";
      }
      fill(s.default.plugin || "local");
      plugin.addEventListener("change", () => {
        s.default.plugin = plugin.value;
        const p = window.PetMind.preset(plugin.value);
        model.value = p.model || "";
        base.value = p.base || "";
      });
      document.getElementById("save").addEventListener("click", () => {
        s.default = { plugin: plugin.value, model: model.value, baseUrl: base.value, apiKey: key.value };
        window.PetMind.save(s);
        document.getElementById("ok").textContent = "Saved. Talk to them again.";
      });
    </script>
  </body>
</html>
