[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computerpets-client"
version = "0.1.0"
description = "PyQt6 blotter client for ComputerPets (client contract unlock + living pet)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyQt6>=6.6",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
computerpets-client = "computerpets_client.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["computerpets_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
