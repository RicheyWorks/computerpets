# Optional Docker Compose overlay — file-mounted secrets (Phase 2.4)
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up --build
#
# Put real values in ./secrets/ (gitignored). Never commit them.
# This overlay clears the inline compose defaults and points the app at
# /run/secrets/* via NAME_FILE. Missing secret files refuse `compose up`.
#
# Local-dev without this overlay still uses env / .env (see .env.example).

services:
  app:
    environment:
      LICENSE_SECRET_KEY: ""
      JWT_SECRET_KEY: ""
      BUNDLE_SIGNING_KEY: ""
      ADMIN_API_KEY: ""
      LICENSE_SECRET_KEY_FILE: /run/secrets/license_secret_key
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      BUNDLE_SIGNING_KEY_FILE: /run/secrets/bundle_signing_key
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      # Optional storefront doors — unset *_FILE until a real key file exists.
      # STEAM_API_KEY_FILE: /run/secrets/steam_api_key
      # ITCH_API_KEY_FILE: /run/secrets/itch_api_key
      # EPIC_CLIENT_ID_FILE: /run/secrets/epic_client_id
      # EPIC_CLIENT_SECRET_FILE: /run/secrets/epic_client_secret
      # EPIC_DEPLOYMENT_ID_FILE: /run/secrets/epic_deployment_id
    secrets:
      - license_secret_key
      - jwt_secret_key
      - bundle_signing_key
      - admin_api_key

secrets:
  license_secret_key:
    file: ./secrets/license_secret_key
  jwt_secret_key:
    file: ./secrets/jwt_secret_key
  bundle_signing_key:
    file: ./secrets/bundle_signing_key
  admin_api_key:
    file: ./secrets/admin_api_key
